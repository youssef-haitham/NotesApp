name: CI & Deploy to DEV

on:
  push:
    branches:
      - main

jobs:
  build_and_unit_test:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ./Notes.API

      - name: Build project
        run: dotnet build ./Notes.API -c Release --no-restore

      - name: Run unit tests
        run: dotnet test --no-build --verbosity normal --filter Category!=Integration

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Apply migrations on DEV database
        run: dotnet ef database update --project ./Notes.API --startup-project ./Notes.API
        env:
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}

  deploy:
    needs: build_and_unit_test
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh

      - name: Railway Login
        run: railway login --token ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}