name: CI & Deploy to DEV

on:
  push:
    branches:
      - main

jobs:
  build_and_unit_test:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore ./Notes.API

      - name: Build
        run: dotnet build ./Notes.API -c Release --no-restore

      - name: Run unit tests
        run: dotnet test --no-build --verbosity normal --filter Category!=Integration

      - name: Restore tools
        run: dotnet tool restore || true

      - name: Apply migrations
        run: dotnet ef database update --project ./Notes.API --startup-project ./Notes.API
        env:
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}

  deploy:
    needs: build_and_unit_test
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh

      - name: Set Railway Context
        run: |
          railway project use ${{ secrets.RAILWAY_PROJECT_ID }}
          railway service use ${{ secrets.RAILWAY_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Deploy to Railway
        run: railway deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}