name: CI on DEV

on:
  push:
    branches:
      - main

jobs:
  build_and_unit_test:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build -c Release --no-restore

      - name: Run unit tests
        run: dotnet test NotesApp.API.Tests -c Release --no-build --verbosity normal

      - name: Restore tools
        run: dotnet tool restore || true

      - name: Verify connection string
        run: |
          if [ -z "$POSTGRES_CONNECTION_STRING" ]; then
            echo "Error: POSTGRES_CONNECTION_STRING secret is not set"
            exit 1
          fi
        env:
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}

      - name: Apply EF migrations
        run: dotnet ef database update --project ./Notes.API --startup-project ./Notes.API --context NoteDBContext --verbose
        env:
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}